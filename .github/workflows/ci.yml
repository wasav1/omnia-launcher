name: CI
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ruff
      - run: ruff check core tests
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: core
      - run: python -m compileall -q core tests

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: find packaging kwin -type f -name '*.sh' -print0 | xargs -0 shellcheck

  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
      - run: find ui plasma -type f -name '*.qml' -print0 | xargs -0 qmllint
