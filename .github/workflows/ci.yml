name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar Qt para las pruebas del asistente
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-qpa-plugins
      - run: python -m pip install ruff==0.17.5
      - run: ruff check core tests
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: core
      - run: python -m compileall -q core tests

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: find packaging kwin -type f -name '*.sh' -print0 | xargs -0 shellcheck

  qml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
      - name: Compilar QML y JavaScript
        shell: bash
        run: |
          compiler=$(dpkg-query -L qt6-declarative-dev-tools | awk '/\/qmlcachegen$/ {print; exit}')
          if [[ ! -x "$compiler" ]]; then
            echo "No se encontró qmlcachegen en las herramientas de Qt"
            exit 1
          fi
          out=$(mktemp -d)
          trap 'rm -rf "$out"' EXIT
          # Las rutas de los plugins de Plasma y de SessionToken se resuelven al
          # instalar Omnia. La compilación de bytecode valida el código sin
          # depender de ese árbol ni de una sesión de escritorio.
          while IFS= read -r -d '' file; do
            target="$out/$file.cpp"
            mkdir -p "$(dirname "$target")"
            "$compiler" --only-bytecode --resource-path "/$file" -o "$target" "$file"
          done < <(find ui plasma -type f -name '*.qml' -print0)
