name: Construir Omnia Game Suite

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suite-installer:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Preparar entorno de Arch
        run: |
          pacman -Syu --noconfirm --needed git python python-build python-installer python-setuptools python-wheel cmake qt6-base qt6-declarative qt6-tools qt6-wayland qt6-svg
          useradd --create-home builder
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Comprobar versión
        if: github.ref_type == 'tag'
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          package = re.search(r"^pkgver=(.+)$", Path("packaging/arch/PKGBUILD").read_text(), re.MULTILINE)
          if not package or package[1] != version or os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Las versiones de la etiqueta, pyproject y PKGBUILD no coinciden.")
          PY
      - name: Construir paquetes y el instalador único
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder OMNIA_PKG_OUT=/tmp/omnia-pkgs packaging/arch/build-local.sh
          runuser -u builder -- env HOME=/home/builder python3 packaging/suite/build-suite.py --packages /tmp/omnia-pkgs --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: omnia-game-suite-installer
          path: dist/Omnia-Game-Suite-*-x86_64.run
          if-no-files-found: error

  draft:
    if: github.ref_type == 'tag'
    needs: suite-installer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: omnia-game-suite-installer
          path: dist
      - name: Crear borrador con un solo instalador
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum dist/*.run
          gh release create "$GITHUB_REF_NAME" dist/*.run --draft --verify-tag --generate-notes \
            --title "Omnia Game Suite ${GITHUB_REF_NAME#v}"
