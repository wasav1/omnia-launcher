name: Construir Omnia Game Suite

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suite-installer:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Preparar entorno de Arch
        run: |
          pacman -Syu --noconfirm --needed git python python-build python-installer python-setuptools python-wheel cmake qt6-base qt6-declarative qt6-tools qt6-wayland qt6-svg
          useradd --create-home builder
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Comprobar versión
        if: github.ref_type == 'tag'
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          package = re.search(r"^pkgver=(.+)$", Path("packaging/arch/PKGBUILD").read_text(), re.MULTILINE)
          if not package or package[1] != version or os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Las versiones de la etiqueta, pyproject y PKGBUILD no coinciden.")
          PY
      - name: Construir paquetes y el instalador único
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder OMNIA_PKG_OUT=/tmp/omnia-pkgs packaging/arch/build-local.sh
          runuser -u builder -- env HOME=/home/builder python3 packaging/suite/build-suite.py --packages /tmp/omnia-pkgs --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: omnia-game-suite-installer
          path: dist/Omnia-Game-Suite-*-x86_64.run
          if-no-files-found: error

  appimage:
    needs: suite-installer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: omnia-game-suite-installer
          path: dist
      - name: Descargar herramientas de AppImage y comprobar sus hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir appimage-tools
          download() {
            local repo=$1 filename=$2
            local url digest
            IFS=$'\t' read -r url digest < <(
              gh api "repos/AppImage/$repo/releases/tags/continuous" --jq \
                ".assets[] | select(.name == \"$filename\") | [.browser_download_url, .digest] | @tsv"
            )
            [[ $url = https://github.com/AppImage/"$repo"/releases/download/* ]]
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
            curl --fail --location --retry 3 "$url" -o "appimage-tools/$filename"
            printf '%s  %s\n' "${digest#sha256:}" "appimage-tools/$filename" | sha256sum --check
          }
          download appimagetool appimagetool-x86_64.AppImage
          download type2-runtime runtime-x86_64
          chmod +x appimage-tools/appimagetool-x86_64.AppImage
      - name: Construir AppImage de Omnia Game Suite
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          chmod +x dist/Omnia-Game-Suite-*.run
          python3 packaging/suite/build-appimage.py --installer dist/Omnia-Game-Suite-*.run \
            --appimagetool appimage-tools/appimagetool-x86_64.AppImage --runtime appimage-tools/runtime-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: omnia-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  draft:
    if: github.ref_type == 'tag'
    needs: [suite-installer, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: omnia-*
          merge-multiple: true
          path: dist
      - name: Crear borrador de GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum dist/*.run dist/*.AppImage
          gh release create "$GITHUB_REF_NAME" dist/*.run dist/*.AppImage --draft --verify-tag --generate-notes \
            --title "Omnia Game Suite ${GITHUB_REF_NAME#v}"
