name: Construir instaladores

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Instalar herramientas de empaquetado
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm zstd
      - name: Comprobar la versión de la etiqueta
        if: github.ref_type == 'tag'
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"La etiqueta {tag} no coincide con la versión {version}")
          PY
      - name: Generar DEB, Arch, RPM, asistente portable y fuentes
        run: python3 packaging/distros/build.py --output dist
      - name: Guardar paquetes
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          if-no-files-found: error

  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Instalar Qt y las herramientas de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev qmake6 qt6-qpa-plugins qt6-wayland libqt6svg6 squashfs-tools
      - name: Descargar herramientas de AppImage y comprobar sus hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir appimage-tools
          download() {
            local repo=$1 filename=$2
            local url digest
            IFS=$'\t' read -r url digest < <(
              gh api "repos/AppImage/$repo/releases/tags/continuous" --jq \
                ".assets[] | select(.name == \"$filename\") | [.browser_download_url, .digest] | @tsv"
            )
            [[ $url = https://github.com/AppImage/"$repo"/releases/download/* ]]
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
            curl --fail --location --retry 3 "$url" -o "appimage-tools/$filename"
            printf '%s  %s\n' "${digest#sha256:}" "appimage-tools/$filename" | sha256sum --check
          }
          download appimagetool appimagetool-x86_64.AppImage
          download type2-runtime runtime-x86_64
          chmod +x appimage-tools/appimagetool-x86_64.AppImage
      - name: Generar AppImage x86-64
        run: |
          python3 packaging/distros/build_appimage.py \
            --appimagetool appimage-tools/appimagetool-x86_64.AppImage \
            --runtime appimage-tools/runtime-x86_64 \
            --output dist
      - name: Guardar AppImage y manifiesto
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/
          if-no-files-found: error

  draft:
    if: github.ref_type == 'tag'
    needs: [packages, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist
          merge-multiple: true
      - name: Consolidar los checksums y el manifiesto
        working-directory: dist
        run: |
          sha256sum -- *.deb *.pkg.tar.zst *.rpm *.run *.tar.gz *.AppImage > SHA256SUMS
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("manifest.json")
          manifest = json.loads(path.read_text())
          manifest["artifacts"].extend(image.name for image in sorted(Path(".").glob("*.AppImage")))
          manifest["tested_installation"] = []
          manifest["target_distro_installation"] = "Artefactos generados. Consulta las notas para la validación en Plasma."
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          PY
      - name: Crear borrador con los instaladores
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag --generate-notes --title "Omnia ${GITHUB_REF_NAME#v}"
