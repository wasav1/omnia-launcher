[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnia-core"
version = "0.4.0"
description = "Núcleo de Omnia: biblioteca unificada de juegos para Linux"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
omnia-core = "omnia.service:main"
omnia-suite-update = "omnia.suite_update:main"
omnia-setup = "omnia.setup:main"
omnia-first-run = "omnia.firstrun:main"

[tool.setuptools.packages.find]
where = ["core"]

[tool.ruff.lint]
# Fix the CI rules explicitly so Ruff updates do not change which checks block a PR.
select = ["E9", "F", "B023"]
