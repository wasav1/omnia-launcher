[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnia-core"
version = "0.1.0"
description = "Núcleo de Omnia: biblioteca unificada de juegos para Linux"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
omnia-core = "omnia.service:main"
omnia-setup = "omnia.setup:main"
omnia-first-run = "omnia.firstrun:main"

[tool.setuptools.packages.find]
where = ["core"]
